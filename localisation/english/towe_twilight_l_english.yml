 FUD_neutrality_party:0 "Clan Council"
 FUD_neutrality_party_long:0 "Clan Council"


#############################################
# POLITICAL UI LOCK MESSAGES
#############################################

 TOWE_POLITICAL_CONTROL_TITLE:0 "Authority of the Throne"
 TOWE_POLITICAL_CONTROL_DESC:0 "In the Jasmine Empire, laws, advisors, and military appointments are not freely chosen by ministers.\n\nThey are the product of political struggle, focus decisions, and the will of the centre.\n\nUse the National Focus tree and Decisions to shape the government. The old free selection of laws and staff has been abolished."

 JAS_empress_lila:0 "Empress Lila"
 JAS_empress_lila_desc:0 "The young Empress who inherited a crumbling mandate. Pale, distant, and far more dangerous than the court realises."

 JAS_pale_sovereign:0 "Pale Sovereign"
 JAS_pale_sovereign_desc:0 "She rules with a cold, distant authority. Courtiers find it difficult to read her, and even harder to oppose her."
 JAS_heir_to_a_dying_mandate:0 "Heir to a Dying Mandate"
 JAS_heir_to_a_dying_mandate_desc:0 "She inherited an empire already cracking. Every decision she makes is measured against the knowledge that the old order is running out of time."


#############################################
# NEW FOCUS LOCALISATION
#############################################
 JAS_reform_education:0 "Reform Education"
 JAS_reform_education_desc:0 "An empire that cannot teach its children cannot expect them to believe in it."
 JAS_reform_provincial_rights:0 "Provincial Rights"
 JAS_reform_provincial_rights_desc:0 "Some autonomy now may prevent open rebellion later."
 JAS_reform_new_compact:0 "A New Compact"
 JAS_reform_new_compact_desc:0 "The centre yields a little power so that the whole may endure."
 JAS_reform_complete_tt:0 "The reformist path is complete. The Mandate has been given a second chance."

 JAS_iron_propaganda:0 "Iron Propaganda"
 JAS_iron_propaganda_desc:0 "Doubt is a luxury the Empire can no longer afford."
 JAS_iron_war_economy:0 "War Economy"
 JAS_iron_war_economy_desc:0 "Everything not essential to victory is a luxury."
 JAS_iron_complete_tt:0 "The Path of Iron is complete. The Empire is ready for total war."

 JAS_retreat_audit:0 "Audit the Empire"
 JAS_retreat_audit_desc:0 "We must know what is still worth holding before we decide what to abandon."
 JAS_retreat_abandon_periphery:0 "Abandon the Periphery"
 JAS_retreat_abandon_periphery_desc:0 "Some borders exist only on maps. It is time to admit it."
 JAS_retreat_fortify_core:0 "Fortify the Core"
 JAS_retreat_fortify_core_desc:0 "What remains will be defended to the last."
 JAS_abandon_periphery_tt:0 "The Empire begins a controlled withdrawal from overextended territories."

#############################################
# BALKAN CRISIS UPDATED
#############################################
 towe_balkan.10.t:0 "The Buffer Breaks Free"
 towe_balkan.10.d:0 "The European Buffer was never meant to last forever. Today its officers and politicians have decided the Mandate no longer protects them — it only restrains them.\n\nIndependence has been declared. War has been declared. The old arrangement is dead."
 towe_balkan.10.a:0 "Then we fight for our freedom."

 towe_balkan.11.t:0 "Serbia Answers the Call"
 towe_balkan.11.d:0 "The Kingdom of the Serbs will not stand idle while the Buffer fights alone. Old grievances and new opportunities have aligned.\n\nWar is joined."
 towe_balkan.11.a:0 "For the South Slavs."

#############################################
# LOWLANDS WHITE PEACE
#############################################
 towe_lowlands.0.t:0 "War in the Lowlands"
 towe_lowlands.0.d:0 "Gaulle and Prussia have moved against English holdings on the continent."
 towe_lowlands.0.a:0 "The map is about to change."

 towe_lowlands.1.t:0 "THE LOWLANDS SETTLEMENT"
 towe_lowlands.1.d:0 "English power on the European mainland has collapsed.\n\nAfter weeks of fighting, the last English garrisons in the Lowlands have surrendered or withdrawn. The question of who inherits the wreckage has already been decided by the victors.\n\nBelgium and the southern territories pass to the Empire of Gaulle.\nThe Netherlands and the northern territories pass to Prussia.\n\nA formal white peace has been arranged. The war in the Lowlands is over."
 towe_lowlands.1.a:0 "A new order in the west."
 towe_lowlands.1.tt:0 "Scripted white peace: Belgium-area states to Gaulle, Netherlands-area states to Prussia. War between the parties ends."

 JAS_advisor_vizier:0 "Grand Vizier"
 JAS_advisor_marshal:0 "Marshal of the Empire"
 JAS_advisor_treasurer:0 "Lord Treasurer"
 JAS_advisor_spymaster:0 "Master of Whispers"
 FUD_khan:0 "Great Khan"
 FUD_advisor_warlord:0 "Warlord of the Banners"
 FUD_advisor_steward:0 "Steward of the Clans"
 FUD_advisor_blade:0 "Blade of the Khan"
 JAS_throne_above_ideology:0 "The Throne Above Ideology"
 JAS_throne_above_ideology_desc:0 "In the Jasmine Empire there is only the Throne. Parties and ideologies are foreign affectations."
 FUD_clan_above_ideology:0 "The Clans Above Ideology"
 FUD_clan_above_ideology_desc:0 "Loyalty is to blood and banner, not to foreign doctrines."
