 towe_asia.1.t:0 "The Eastern Front Opens"
 towe_asia.1.d:0 "The imperial proclamation has reached the eastern capitals. There is no longer room for the comfortable fiction that the frontier can be managed by envoys alone. Great Fu and the Mongol Confederation must decide whether the imperial compact is a living promise or a phrase printed on old treaties. Their answer will determine whether this remains a border war or becomes the defining conflict of a generation."
 towe_asia.1.a:0 "The compact will be honoured"
