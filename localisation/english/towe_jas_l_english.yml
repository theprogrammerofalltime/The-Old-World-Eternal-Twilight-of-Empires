l_english:
 # Focuses
 
 
 
 
 JAS_assess_the_treasury: "Assess the Treasury"
 JAS_assess_the_treasury_desc: "Before any path can be chosen, we must know the true state of the realm's wealth—and its debts."
 JAS_treasury_assessment_tt: "Economy variables initialized. GDP, debt, and growth tracking begins."
 
 JAS_the_mandate_of_heaven_cracks: "The Mandate of Heaven Cracks"
 JAS_the_mandate_of_heaven_cracks_desc: "The crisis can no longer be denied. The old consensus is dead. What rises in its place will define the Jasmine Empire."
 
 
 
 JAS_retreat_path_tt: "The Conservative Restoration path is chosen."
 
 JAS_path_of_revolution: "The Path of Revolution"
 JAS_path_of_revolution_desc: "The old regime is beyond saving. Only the complete overthrow of the existing order can liberate the people of Jasmine."
 JAS_revolution_path_tt: "The Revolutionary path is chosen. Dangerous and uncertain."
 
 # Economy tooltips
 towe_high_tax_tt: "Tax rate increased. Higher revenue but lower stability."
 towe_low_tax_tt: "Tax rate lowered. Growth encouraged at the cost of revenue."
 towe_increase_spending_tt: "Government spending rises. Debt increases."
 towe_austerity_tt: "Harsh cuts implemented. Stability suffers but debt stabilizes."
 towe_industrial_investment_tt: "Industrial capacity expanded. Factories and GDP rise; debt increases."
 towe_agricultural_reform_tt: "Agricultural output improves through reform."
 
 # Events
 towe_jas.1.b: "Assert authority by force"
 
 
 towe_jas.11.t: "The Constitutional Compact"
 towe_jas.11.d: "After months of negotiation, a new compact is signed. The throne retains significant powers, but a national assembly and provincial charters now limit arbitrary rule. It is an imperfect settlement—yet it holds."
 towe_jas.11.a: "A new foundation is laid"
 
 towe_jas.20.t: "The Iron Ministry"
 towe_jas.20.d: "Generals and hardline courtiers dominate the new government. Their message is simple: obedience, strength, and the restoration of order by any means necessary."
 towe_jas.20.a: "The army stands ready"
 
 towe_jas.21.t: "The New Order Proclaimed"
 towe_jas.21.d: "The old factions have been broken. A centralized military-backed regime now rules. The provinces are quiet—for now. The question is whether this order can endure."
 towe_jas.21.a: "Order has been restored"
 
 towe_jas.30.t: "The Conservative Restoration"
 towe_jas.30.d: "Traditionalists regain the upper hand. Foreign advisors are dismissed, old rites restored, and the court turns inward. Stability returns, bought at the price of isolation."
 towe_jas.30.a: "Harmony within, walls without"
 
 towe_jas.31.t: "Harmony Restored"
 towe_jas.31.d: "The rites are observed. The clans are appeased. The land yields its harvest. Outsiders may mock our 'backwardness', but the people are quiet and the throne secure."
 towe_jas.31.a: "The old ways endure"
 
 towe_jas.40.t: "The Revolutionary Surge"
 towe_jas.40.d: "Radical agitators seize the moment. People's councils form in several provinces. The army is divided. The court is terrified. The future is suddenly unwritten."
 towe_jas.40.a: "The people rise"
 
 towe_jas.41.t: "The New Jasmine"
 towe_jas.41.d: "The old regime has fallen. A revolutionary government proclaims the People's Jasmine Republic. Whether this experiment survives the reaction that will surely come remains to be seen."
 towe_jas.41.a: "A new dawn—or a new terror"
 
 towe_jas.50.t: "A Constitutional Settlement"
 towe_jas.50.d: "By 1915 the Jasmine Empire has become something new: a constitutional monarchy with functioning institutions, growing industry, and a measure of popular legitimacy. The crisis of 1905 feels distant."
 towe_jas.50.a: "The future is open"
 
 towe_jas.51.t: "The Empire of Iron"
 towe_jas.51.d: "The authoritarian regime has consolidated. The army is strong, the administration efficient, and dissent is rare. Whether this strength will be used for defence or conquest is the next question."
 towe_jas.51.a: "Strength above all"
 
 towe_jas.52.t: "The Quiet Empire"
 towe_jas.52.d: "Jasmine has withdrawn from the storms of the wider world. Internal harmony has been purchased with isolation and stagnation. For many, that is enough."
 towe_jas.52.a: "Better quiet than chaos"
 
 towe_jas.53.t: "The Workers' Jasmine"
 towe_jas.53.d: "The revolutionary state has survived its first years. Collectivization continues, the Red Army grows, and the old elites are broken. The cost has been high—but the new order stands."
 towe_jas.53.a: "The struggle continues"

 JAS_the_scholars_debate: "The Scholars Debate"
 JAS_the_scholars_debate_desc: "Learned men argue over the meaning of the crisis. Their words may yet shape policy."
 JAS_the_generals_whisper: "The Generals Whisper"
 JAS_the_generals_whisper_desc: "In the barracks and staff rooms, officers discuss what the army must do if the court fails."
 JAS_the_merchants_complain: "The Merchants Complain"
 JAS_the_merchants_complain_desc: "Trade is disrupted. Credit is tight. The merchant houses demand action."
 JAS_the_peasants_stir: "The Peasants Stir"
 JAS_the_peasants_stir_desc: "In the countryside the old patience is fraying. Hungry men become dangerous men."
 
