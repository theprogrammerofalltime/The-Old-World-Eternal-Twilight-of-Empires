 # Party names - Jasmine Empire

 # Super Event text
 towe_balkan.1.t:0 "§RTHE BALKAN CRISIS§!"
 towe_balkan.1.d:0 "§YFebruary 1906.§!\n\nAcross the Balkan provinces the storm has broken.\n\nStudents, officers and local notables have raised the banner of revolt. Imperial garrisons are under siege. Telegraphs from Sofia, Skopje and the mountain passes speak of open rebellion.\n\nIn London, Paris, Berlin and Vienna the cabinets meet through the night. Expeditionary forces are already being mustered.\n\nThe Jasmine Empire stands at a crossroads. Order must be restored — or the Empire itself may fracture.\n\n§RThe age of easy dominion is over.§!"
 towe_balkan.1.a:0 "The Empire endures."
 towe_balkan_revolt_tt:0 "§RSuper Event: The Balkan Crisis§!\nA new focus tree is loaded. Unrest spreads. European powers prepare intervention. The crisis focus tree remains until 1910."

 JAS_early_tree_tt:0 "Complete the short opening chain before February 1906 to prepare for the coming storm."
 JAS_watch_balkans_tt:0 "Intelligence reports growing unrest in the Balkan provinces."
 JAS_prepare_unrest_tt:0 "The Empire is as ready as it can be for the crisis that is coming."
 JAS_crisis_ongoing_until_1910_tt:0 "The Balkan Crisis focus tree will remain active until 1910. A decision will then allow a return to the main imperial focus tree."
 JAS_return_to_imperial_focus_tt:0 "The main post-1910 imperial focus tree is now available."
 JAS_post_imperial_restoration:0 "Imperial Restoration"
 JAS_post_imperial_restoration_desc:0 "With the Balkan crisis behind us, the throne reasserts its authority."
 JAS_post_industrial_drive:0 "Industrial Drive"
 JAS_post_industrial_drive_desc:0 "Factories and workshops expand across the heartland."
 JAS_post_military_reform:0 "Military Reform"
 JAS_post_military_reform_desc:0 "The lessons of the crisis are written into doctrine."
 JAS_post_diplomatic_reassertion:0 "Diplomatic Reassertion"
 JAS_post_diplomatic_reassertion_desc:0 "The buffer states and the courts of Europe are reminded of imperial strength."
 JAS_post_great_power:0 "Great Power of the Old World"
 JAS_post_great_power_desc:0 "The Jasmine Empire takes its place among the powers of the new century."

