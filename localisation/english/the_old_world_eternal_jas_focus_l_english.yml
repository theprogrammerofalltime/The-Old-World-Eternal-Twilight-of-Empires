l_english:
 JAS_imperial_consolidation:0 "Imperial Consolidation"
 JAS_imperial_consolidation_desc:0 "The Empire has stood longer than any other, but its edges are fraying. Before we can rebuild we must first remember what holds it together."
 JAS_imperial_workshops:0 "Imperial Workshops"
 JAS_imperial_workshops_desc:0 "Old guild halls and crown manufactories are given new charters and new purpose."
 JAS_arsenal_districts:0 "Arsenal Districts"
 JAS_arsenal_districts_desc:0 "The capital is ringed with new foundries and rolling mills, feeding the armies of the Empire."
 JAS_imperial_academies:0 "Imperial Academies"
 JAS_imperial_academies_desc:0 "Scholars from across the provinces are gathered into one great institution."
 JAS_scholars_of_the_empire:0 "Scholars of the Empire"
 JAS_scholars_of_the_empire_desc:0 "Engineers and scholars work side by side, and the Empire learns to invent as well as to inherit."
 JAS_reform_the_bureaucracy:0 "Reform the Bureaucracy"
 JAS_reform_the_bureaucracy_desc:0 "Centuries of accumulated offices are pruned, and what remains is made to answer to the throne."
 JAS_protectorate_system:0 "The Protectorate System"
 JAS_protectorate_system_desc:0 "The African, European and Indian buffer states are bound to the Empire by formal treaty and a resident of the crown."
 JAS_provincial_loyalty:0 "Provincial Loyalty"
 JAS_provincial_loyalty_desc:0 "Local customs and local lords are confirmed in their rights, in exchange for loyalty to the crown."
 JAS_imperial_unity:0 "Imperial Unity"
 JAS_imperial_unity_desc:0 "From the Bosphorus to the Persian Gulf, one throne and one law."
 JAS_modernise_the_legions:0 "Modernise the Legions"
 JAS_modernise_the_legions_desc:0 "The old regiments are re-armed and re-drilled in the manner of the new century."
 JAS_garrison_system:0 "The Garrison System"
 JAS_garrison_system_desc:0 "Fortified garrisons are placed along every frontier and every restless province."
 JAS_imperial_fleet:0 "The Imperial Fleet"
 JAS_imperial_fleet_desc:0 "A fleet worthy of an empire with so many coasts to guard."
 JAS_veteran_corps:0 "The Veteran Corps"
 JAS_veteran_corps_desc:0 "The best of the garrisons and the fleet are formed into a standing professional corps."
 JAS_the_eternal_empire:0 "The Eternal Empire"
 JAS_the_eternal_empire_desc:0 "Empires fall, as every schoolchild knows. This one will be the exception."
 JAS_imperial_bureaucracy:0 "Imperial Bureaucracy"
 JAS_imperial_bureaucracy_desc:0 "Imperial Bureaucracy."
 JAS_arsenal_districts_bonus:0 "Arsenal Districts"
 JAS_scholars_bonus:0 "Scholars of the Empire"
 JAS_legions_bonus:0 "Modernise the Legions"
 JAS_fleet_bonus:0 "The Imperial Fleet"

 # Balkan Crisis focus tree
 JAS_balkan_uprising:0 "The Balkan Uprising"
 JAS_balkan_uprising_desc:0 "In the second month of 1906 the Balkan provinces rise. The old order is tested."
 JAS_crush_the_rebels:0 "Crush the Rebels"
 JAS_crush_the_rebels_desc:0 "The legions march. Order will be restored by force."
 JAS_negotiate_with_europe:0 "Negotiate with Europe"
 JAS_negotiate_with_europe_desc:0 "The European courts are stirring. Perhaps words can still avert a wider war."
 JAS_fortify_the_straits:0 "Fortify the Straits"
 JAS_fortify_the_straits_desc:0 "Istanbul and the Bosporus must be made impregnable."
 JAS_mobilise_the_empire:0 "Mobilise the Empire"
 JAS_mobilise_the_empire_desc:0 "Every province, every buffer state, every loyal subject is called to the colours."
 JAS_call_the_buffers:0 "Call the Buffer States"
 JAS_call_the_buffers_desc:0 "The European, African and Indian buffers owe their existence to the Empire. Now they will pay that debt."
 JAS_decisive_campaign:0 "Decisive Campaign"
 JAS_decisive_campaign_desc:0 "One great offensive to end the revolt and deter the Europeans."
 JAS_post_crisis_order:0 "A New Imperial Order"
 JAS_post_crisis_order_desc:0 "The crisis has passed. The Empire is harder, leaner, and more united than before."
 JAS_balkan_uprising_tt:0 "The Balkan Crisis focus tree is now active."
 JAS_post_crisis_order_tt:0 "The worst of the crisis is over. The Empire endures."

 # Events
 towe_balkan.2.t:0 "Intervention in the Balkans"
 towe_balkan.2.d:0 "The Jasmine Empire's Balkan provinces are in open revolt. Our own prestige and the balance of power demand a response."
 towe_balkan.2.a:0 "Dispatch an expeditionary force."
 towe_balkan.2.b:0 "This is not our affair."
 towe_european_intervention_tt:0 "Two infantry divisions are raised for Balkan service. Relations with the Jasmine Empire worsen."
 towe_balkan.4.t:0 "European Intervention"
 towe_balkan.4.d:0 "Several European powers have announced the dispatch of expeditionary forces to the Balkans. They claim to protect Christian populations and their own interests."
 towe_balkan.4.a:0 "Let them come."
 towe_europeans_coming_tt:0 "European expeditionary forces are mobilising against us."

