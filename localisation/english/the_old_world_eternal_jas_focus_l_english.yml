 JAS_decisive_offensive:0 "Decisive Offensive"
 JAS_decisive_offensive_desc:0 "All available strength is concentrated for a single crushing campaign."
 towe_balkan_expedition:0 "Balkan Expedition"
 towe_balkan_expedition_desc:0 "Our forces are organised for limited overseas intervention."

