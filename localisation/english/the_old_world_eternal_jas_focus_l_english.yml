 JAS_return_to_imperial_focus:0 "Restore the Imperial Focus"
 JAS_return_to_imperial_focus_desc:0 "With the crisis resolved and the calendar past 1910, the Empire returns to its long-term programme of consolidation and expansion."

 JAS_secure_the_heartland:0 "Secure the Heartland"
 JAS_secure_the_heartland_desc:0 "Stabilise the imperial heartland and prepare the provinces for reform."

 JAS_prepare_for_unrest:0 "Prepare for Unrest"
 JAS_prepare_for_unrest_desc:0 "Prepare the empire for the unrest gathering in the Balkans."

 JAS_ready_the_legions:0 "Ready the Legions"
 JAS_ready_the_legions_desc:0 "Reorganise and equip the imperial legions for the challenges ahead."
 JAS_watch_the_balkans:0 "Watch the Balkans"
 JAS_watch_the_balkans_desc:0 "Gather intelligence on the growing unrest in the Balkan provinces."

 TOWE_reclaim_the_low_countries:0 "Reclaim the Low Countries"
 TOWE_reclaim_the_low_countries_desc:0 "The English state holds lands claimed by our nations. We must be prepared to take Belgium and the Netherlands back by force."

 # Imperial Chronicle — original pre-crisis narrative events
 towe_imperial.1.t:0 "The Census of the Crown"
 towe_imperial.1.d:0 "The census returns arrive in the capital as bundles of paper tied with red cord. The figures are precise; their meaning is not. Officials disagree over how much authority the provinces should surrender to make the Empire easier to govern. In the corridors, everyone speaks of efficiency. In the provinces, they will call it something else."
 towe_imperial.1.a:0 "The centre must know every corner of the Empire."
 towe_imperial.1.b:0 "Let the local compacts stand, for now."
 towe_imperial.2.t:0 "The Provincial Question"
 towe_imperial.2.d:0 "Reports from the western possessions describe a growing distance between imperial law and provincial life. Some ministers urge a firm demonstration of authority; others warn that obedience extracted too publicly may not last. The question is no longer whether the system is strained, but what the throne is prepared to spend to preserve it."
 towe_imperial.2.a:0 "A show of resolve will silence the doubters."
 towe_imperial.2.b:0 "Offer concessions before resentment hardens."
 towe_imperial.3.t:0 "A Dispatch from Sofia"
 towe_imperial.3.d:0 "A sealed dispatch from Sofia lies unopened on the foreign minister's desk for nearly an hour. Its language is formal, its requests modest, and its implications unmistakable: the arrangements that have kept the European buffer states quiet are losing their authority. The court can prepare for a confrontation, or gamble that another round of assurances will buy time. No one in the room believes time is unlimited."
 towe_imperial.3.a:0 "Quietly prepare the legions for contingencies."
 towe_imperial.3.b:0 "Give diplomacy one final chance."

 # Imperial Chronicle: the cabinet, the provinces, and the coming crisis
 towe_imperial.4.t:0 "Minutes from the Imperial Cabinet"
 towe_imperial.4.d:0 "The cabinet's minutes are circulated in three versions, each omitting a different argument. The finance minister warns that the provinces are costly to govern; the war minister insists that the cost of retreat would be greater. By evening, the palace has agreed on a compromise so narrow that every faction can claim victory—and every faction begins preparing for its failure."
 towe_imperial.4.a:0 "Keep the coalition together, whatever the price."
 towe_imperial.4.b:0 "Let the ministers discover where the throne stands."
 towe_imperial.5.t:0 "The Sofia Memorandum"
 towe_imperial.5.d:0 "The latest memorandum from Sofia does not demand independence. It demands that imperial promises mean what they say. That distinction is lost on the hardliners, who see only a challenge to the Crown; it is lost on the reformers too, who know that a promise once written down can become a precedent. The document is placed before the Emperor without recommendation."
 towe_imperial.5.a:0 "Authorise a quiet military contingency plan."
 towe_imperial.5.b:0 "Send negotiators before the generals take over."
 towe_balkan.3.t:0 "The Buffer States Take Up Arms"
 towe_balkan.3.d:0 "The Jasmine European Buffer States have rejected the imperial settlement. Their declaration is no palace mutiny and no provincial revolt: it is a war between governments. The Kingdom of Serbs faces a choice between abandoning its neighbours and entering a conflict that may redraw the entire peninsula. Across the imperial court, the question is no longer whether the crisis can be contained, but how much of the old order will survive it."
 towe_balkan.3.a:0 "The Balkan War has begun."
