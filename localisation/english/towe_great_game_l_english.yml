l_english:
 towe_great_game:0 "The Great Game"
 towe_great_game_desc:0 "The Hilāl Bloc and the Iron Pact contest prestige, diplomatic access, and influence across the old world. Military missions increase escalation; back-channel negotiations lower it. Accumulated influence can be invested in internal cohesion."
 towe_jas_trade_mission:0 "Send an Imperial Trade Mission"
 towe_jas_trade_mission_desc:0 "Expand Jasmine commercial influence without risking an immediate confrontation."
 towe_prg_trade_mission:0 "Dispatch Iron Pact Commercial Envoys"
 towe_prg_trade_mission_desc:0 "Strengthen our position among the rival powers and neutral states."
 towe_jas_military_mission:0 "Demonstrate the Imperial Standard"
 towe_jas_military_mission_desc:0 "Send officers and matériel experts to increase our bloc's international standing. The rival powers will not take this lightly."
 towe_prg_military_mission:0 "Conduct an Iron Pact Military Mission"
 towe_prg_military_mission_desc:0 "Expand military coordination and signal our strategic resolve."
 towe_jas_backchannel:0 "Open Secret Negotiations"
 towe_jas_backchannel_desc:0 "Reduce the risk of a wider diplomatic rupture through private contacts."
 towe_prg_backchannel:0 "Offer Confidential Talks"
 towe_prg_backchannel_desc:0 "Use diplomatic channels to lower the chance of escalation."
 towe_jas_consolidate_sphere:0 "Consolidate the Hilāl Bloc"
 towe_jas_consolidate_sphere_desc:0 "Convert international influence into a firmer domestic and political settlement."
 towe_prg_consolidate_sphere:0 "Reaffirm the Iron Pact"
 towe_prg_consolidate_sphere_desc:0 "Consolidate the bloc's political support at home."
 towe_emergency_conference_jas:0 "Convene an Imperial Peace Conference"
 towe_emergency_conference_jas_desc:0 "Offer negotiations before the Great Game becomes a general confrontation."
 towe_emergency_conference_prg:0 "Propose a Great Power Conference"
 towe_emergency_conference_prg_desc:0 "Bring the opposing blocs back to the negotiating table."
 towe_great_game.1.t:0 "The Great Game Reaches a Crisis"
 towe_great_game.1.d:0 "The diplomatic contest between the Hilāl Bloc and the Iron Pact has reached dangerous heights. Our ministers demand a choice between a demonstration of resolve and a painful compromise."
 towe_great_game.1.a:0 "Our position must be defended."
 towe_great_game.1.b:0 "There is still time to negotiate."
 towe_great_game.2.t:0 "A Crisis Between the Blocs"
 towe_great_game.2.d:0 "News from the Jasmine court suggests that relations between the two blocs have entered a more dangerous phase. We must decide how to answer."
 towe_great_game.2.a:0 "The Pact will not be intimidated."
 towe_great_game.2.b:0 "Keep the diplomats talking."

 towe_jas_outreach_plc:0 "Jasmine Envoys to the Polish-Lithuanian Court"
 towe_jas_outreach_plc_desc:0 "Court the Polish-Lithuanian Kingship through trade, diplomacy, and personal envoys."
 towe_prg_outreach_plc:0 "Iron Pact Mission to Poland-Lithuania"
 towe_prg_outreach_plc_desc:0 "Strengthen the Pact's presence among the old kingdoms."
 towe_jas_outreach_azt:0 "Jasmine Mission to the Aztec States"
 towe_jas_outreach_azt_desc:0 "Open a diplomatic channel across the ocean to the reorganised Aztec states."
 towe_prg_outreach_azt:0 "Iron Pact Mission to the Aztec States"
 towe_prg_outreach_azt_desc:0 "Expand diplomatic prestige beyond the traditional European contest."
 towe_jas_support_client:0 "Send Assistance to Great Fu"
 towe_jas_support_client_desc:0 "Provide wartime political support and diplomatic cover to our eastern ally."
 towe_prg_support_client:0 "Support Gaul's Wartime Cabinet"
 towe_prg_support_client_desc:0 "Help the Empire of Gaulle sustain its government in a regional conflict."
 towe_great_game_outreach:0 "Great Power Diplomatic Mission"
 towe_great_game_coercion:0 "Great Power Pressure"
