l_english:
 towe_chronicle.1.t:0 "The Balkan Telegrams"
 towe_chronicle.1.d:0 "The first message arrived before dawn. By noon, the cabinet table was buried beneath dispatches from the provincial governors, railway commanders and imperial police. The reports disagreed on almost every detail except one: the garrisons could no longer assume that the countryside behind them was loyal.\n\nThe court wants a demonstration of authority. The treasury wants to know what it will cost. The General Staff has already begun counting trains."
 towe_chronicle.1.a:0 "Convene the emergency cabinet."
 towe_chronicle.1.b:0 "Offer the provinces one final concession."
 towe_chronicle.2.t:0 "The Council of Measures"
 towe_chronicle.2.d:0 "The ministers have agreed to meet, though agreement ends at the door. One faction argues that the crisis is a local disturbance that can be contained with arrests and a few carefully worded decrees. Another insists that every delay will be read abroad as weakness. On the map, the frontier is a red pencil line. In the room, it is an argument over the future of the state."
 towe_chronicle.2.a:0 "Authorise the contingency plans."
 towe_chronicle.2.b:0 "Place the state under emergency direction."
 towe_chronicle.3.t:0 "Orders for the Frontier"
 towe_chronicle.3.d:0 "The orders leave the capital in sealed envelopes. Reserve depots are opened, staff officers are assigned to the railways, and provincial commanders receive authority they had requested for years. Nothing in the communiqué uses the word war. Everyone who reads it understands what the preparations mean."
 towe_chronicle.3.a:0 "The Empire will not be caught unprepared."
 towe_chronicle.10.t:0 "The Eastern Question Becomes a War"
 towe_chronicle.10.d:0 "For years the eastern frontier has been managed through envoys, subsidies and carefully ambiguous promises. That arrangement has now failed. The first communiqués are short, the maps are already outdated, and every capital is asking the same question: how far will the Jasmine Empire go?\n\nThe public statement promises a limited operation. The General Staff has been issued maps for a campaign with no clear limit."
 towe_chronicle.10.a:0 "Issue the imperial proclamation."
 towe_chronicle.10.b:0 "Keep the declaration narrow; let the army decide the pace."
 towe_chronicle.11.t:0 "The First Field Reports"
 towe_chronicle.11.d:0 "The first reports are incomplete and contradictory. A bridge is said to have fallen; a corps is said to be advancing; a supply column has vanished from the ledger. The newspapers print the communiqué they are given. In the ministries, clerks mark each new report in red and send it upstairs. The war has begun, but its shape is not yet known."
 towe_chronicle.11.a:0 "Prepare the public for a long campaign."
 towe_chronicle.12.t:0 "A Front Without a Clear Ending"
 towe_chronicle.12.d:0 "The campaign has entered its next phase. The front has stabilised in some sectors and dissolved in others. Officers ask for reserves; ministers ask for a timetable; families ask when the lists will stop growing. The state must decide whether to present the conflict as a short operation that has gone astray or as a struggle whose cost must be openly acknowledged."
 towe_chronicle.12.a:0 "The home front must be protected."
 towe_chronicle.12.b:0 "Give the commanders what they need."
 towe_chronicle.20.t:0 "The Guarantees Expire"
 towe_chronicle.20.d:0 "The last diplomatic note has been delivered. Its language is restrained, almost courteous, but the meaning is unmistakable: the old guarantees no longer restrain the signatories. Railway schedules are being revised, reserve officers recalled and ambassadors placed on notice. The crisis has not yet become a general war. It has become a timetable from which every government is afraid to be absent."
 towe_chronicle.20.a:0 "Put the state on a war footing."
 towe_chronicle.20.b:0 "Tell the public diplomacy has failed."

