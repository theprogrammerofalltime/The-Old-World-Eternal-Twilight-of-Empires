 towe_chronicle.30.t:0 "The Celestial Court Divides"
 towe_chronicle.30.d:0 "The court in Great Fu has received the imperial request. The language is ceremonial; the implications are not. The ministers know that a refusal would weaken every treaty on which their own authority rests. They also know that an expedition eastward could leave the realm exposed at home. The debate is conducted behind screens, but the clerks have already prepared two sets of orders."
 towe_chronicle.30.a:0 "The oath must be honoured."
 towe_chronicle.30.b:0 "Commit carefully; preserve the reserves."
 towe_chronicle.31.t:0 "The Clans Answer the Drum"
 towe_chronicle.31.d:0 "The call to assemble has travelled across the steppe. Some chiefs arrive with horses and men; others arrive with lists of grievances and demands for guarantees. The confederation is not a machine that can be switched on by decree. Its strength comes from agreements made in person, and every agreement has a price."
 towe_chronicle.31.a:0 "Call the banners and settle the argument later."
 towe_chronicle.31.b:0 "Secure the compact before the march."
